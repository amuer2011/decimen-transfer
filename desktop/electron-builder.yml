appId: com.decimen.opticaltransfer
productName: Decimen Optical Transfer
copyright: Copyright © 2026 Evan Crawley
icon: public/icon-512.png
directories:
  output: artifacts/desktop
  buildResources: desktop/resources
files:
  - desktop/**
  - dist/**
  - package.json
asar: true
mac:
  category: public.app-category.utilities
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  artifactName: Decimen.Optical.Transfer-v${version}-mac-${arch}.${ext}
win:
  target:
    - target: portable
      arch:
        - x64
  artifactName: Decimen.Optical.Transfer-v${version}-win-${arch}.${ext}
linux:
  category: Utility
  maintainer: Decimen
  executableName: decimen-optical-transfer
  # Kylin V10's Wayland path crashes Electron 40 before the app code loads.
  # Launch through XWayland from the desktop entry; DISPLAY is available in
  # the target UKUI session.
  executableArgs:
    - --ozone-platform=x11
  target:
    - target: deb
      arch:
        - arm64
  artifactName: Decimen.Optical.Transfer-${version}-kylin-aarch64.${ext}
