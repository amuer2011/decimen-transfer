name: Desktop Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and attach desktop artifacts to
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Mac
        run: npm run desktop:mac

      - name: Upload Mac artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac-release
          path: artifacts/desktop/*.dmg
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows
        run: npm run desktop:win

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: artifacts/desktop/*.exe
          if-no-files-found: error

  build-kylin:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Kylin arm64 package
        run: npm run desktop:kylin

      - name: Verify package name and architecture
        id: package
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          deb="artifacts/desktop/Decimen.Optical.Transfer-${version}-kylin-aarch64.deb"
          test -f "$deb"
          test "$(dpkg-deb -f "$deb" Architecture)" = "arm64"
          echo "deb=$deb" >> "$GITHUB_OUTPUT"

      - name: Upload Kylin artifact
        uses: actions/upload-artifact@v4
        with:
          name: kylin-aarch64-release
          path: ${{ steps.package.outputs.deb }}
          if-no-files-found: error
          compression-level: 0

  release:
    needs:
      - build-mac
      - build-windows
      - build-kylin
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Decimen Transfer ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            release/mac-release/*.dmg
            release/windows-release/*.exe
            release/kylin-aarch64-release/*.deb
