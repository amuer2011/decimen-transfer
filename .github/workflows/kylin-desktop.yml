name: Kylin Desktop

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

# Keep only the newest package for a branch. Tagged release packages are built
# separately by desktop-release.yml and are never cancelled.
concurrency:
  group: kylin-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-kylin:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build Kylin arm64 package
        run: npm run desktop:kylin

      - name: Verify package name and architecture
        id: package
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          deb="artifacts/desktop/Decimen.Optical.Transfer-${version}-kylin-aarch64.deb"
          test -f "$deb"
          test "$(dpkg-deb -f "$deb" Architecture)" = "arm64"
          echo "deb=$deb" >> "$GITHUB_OUTPUT"

      - name: Upload Kylin package
        uses: actions/upload-artifact@v4
        with:
          name: decimen-kylin-aarch64-${{ github.sha }}
          path: ${{ steps.package.outputs.deb }}
          if-no-files-found: error
          compression-level: 0
